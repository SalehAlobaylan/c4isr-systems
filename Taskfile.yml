version: "3"

vars:
  # HOME is unset on Windows, so fall back to USERPROFILE for the Go tool bin.
  TOOLBIN: '{{if .HOME}}{{.HOME}}{{else}}{{.USERPROFILE}}{{end}}/go/bin'
  # Windows cannot exec a .sh file directly, so every ops script is run through a
  # POSIX shell. Git for Windows ships one; override with C4ISR_SHELL_BIN if it
  # lives elsewhere (for example "C:/tools/msys64/usr/bin/bash.exe").
  SHELL_BIN: '{{if eq OS "windows"}}{{.C4ISR_SHELL_BIN | default (printf "%s/Git/bin/bash.exe" (replace "\\" "/" (.ProgramFiles | default "C:/Program Files")))}}{{else}}{{.C4ISR_SHELL_BIN | default "sh"}}{{end}}'
  DATABASE_URL: '{{.C4ISR_DATABASE_URL | default "postgres://c4isr:c4isr@localhost:5433/c4isr?sslmode=disable"}}'
  COMPOSE: docker compose -f deployments/docker-compose.yml
  STAGING_COMPOSE: docker compose --env-file deployments/staging/.env.staging -f deployments/staging/docker-compose.yml
  RECOVERY_PYTHON: '{{if eq OS "windows"}}.venv-recovery/Scripts/python.exe{{else}}.venv-recovery/bin/python{{end}}'

tasks:
  local:setup:
    desc: Install persistent EMAD development infrastructure, identities and real content
    cmds:
      - python scripts/ops/local.py setup
  local:doctor:
    desc: Diagnose scoped EMAD feature readiness without exposing credentials
    cmds:
      - python scripts/ops/local.py doctor
  local:stop:
    desc: Stop the supported development supervisor and workers, preserving database and storage
    cmds:
      - python scripts/ops/local.py stop
  local:web:entry:
    desc: Keep the stable loopback browser address connected to the regular running local UI
    cmds:
      - node scripts/ops/local_web_entry.mjs --port 5198 --target "{{.C4ISR_WEB_ORIGIN | default "http://localhost:5173"}}"
  local:backup:
    desc: Create a paired backup after stopping every writer (requires QUIESCED=true)
    requires:
      vars: [QUIESCED]
    preconditions:
      - sh: 'test "{{.QUIESCED}}" = "true"'
        msg: Stop all writers and explicitly confirm QUIESCED=true
    cmds:
      - '"{{.RECOVERY_PYTHON}}" scripts/ops/paired_backup.py backup --quiesced'
  map:qualify:sample:
    desc: Run an isolated synthetic five-session ten-profile sample (does not qualify MAP-6)
    requires:
      vars: [OUTPUT]
    cmds:
      - '"{{.RECOVERY_PYTHON}}" scripts/ops/qualify_map_first.py sample --output "{{.OUTPUT}}" --seconds {{.SECONDS | default "5"}}'
  local:restore:test:
    desc: Restore the latest paired backup into isolated containers and verify referenced content
    cmds:
      - '"{{.RECOVERY_PYTHON}}" scripts/ops/paired_backup.py restore-test'
  dev:
    desc: Start the map API, web application and public workers
    cmds:
      - python scripts/ops/local.py dev
  dev:historical:
    desc: Start the preserved full historical installation explicitly
    cmds:
      - python scripts/ops/local.py dev --profile historical-full
  local:setup:historical:
    desc: Install preserved historical workers and development identities explicitly
    cmds:
      - python scripts/ops/local.py setup --profile historical-full
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Install Go tooling and frontend dependencies
    cmds:
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - pnpm install

  dev:db:
    desc: Start PostgreSQL/PostGIS via Docker Compose
    cmds:
      - "{{.COMPOSE}} up -d --wait"

  db:down:
    desc: Stop local infrastructure
    cmds:
      - "{{.COMPOSE}} down"

  db:reset:
    desc: Recreate the database volume, migrate, and stop nothing else
    cmds:
      - "{{.COMPOSE}} down -v"
      - task: dev:db
      - task: db:migrate

  db:migrate:
    desc: Apply SQL migrations after the migration preflight
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
      GOOSE_BIN: "{{.TOOLBIN}}/goose"
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/migrate.sh up'

  db:rollback:
    desc: Roll back the most recent migration (production/staging require explicit approval)
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
      GOOSE_BIN: "{{.TOOLBIN}}/goose"
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/migrate.sh down'

  db:status:
    desc: Show migration status
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
      GOOSE_BIN: "{{.TOOLBIN}}/goose"
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/migrate.sh status'

  db:backup:
    desc: Create an encrypted-at-rest-ready custom PostgreSQL dump and checksum
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
    cmds:
      - cmd: |
          if [ -n "{{.BACKUP | default ""}}" ]; then
            "{{.SHELL_BIN}}" ./scripts/ops/backup.sh "{{.BACKUP}}"
          else
            "{{.SHELL_BIN}}" ./scripts/ops/backup.sh
          fi

  db:restore:test:
    desc: Restore a dump into a temporary database and verify PostGIS/schema integrity
    requires:
      vars: [BACKUP]
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/restore-test.sh "{{.BACKUP}}"'

  staging:backup:
    desc: Dump the staging database from inside the Compose network
    cmds:
      - cmd: |
          if [ -n "{{.BACKUP | default ""}}" ]; then
            "{{.SHELL_BIN}}" ./scripts/ops/staging-backup.sh "{{.BACKUP}}"
          else
            "{{.SHELL_BIN}}" ./scripts/ops/staging-backup.sh
          fi

  sqlc:
    desc: Regenerate Go database code from SQL
    dir: db
    cmds:
      - '"{{.TOOLBIN}}/sqlc" generate'

  build:
    desc: Build the server binary
    cmd: |
      set -e
      mkdir -p bin
      go build -o bin/c4isr-server ./apps/c4isr-server

  build:all:
    desc: Build the API, provisioning tools, and independent Go workers/runtimes
    cmds:
      - go build -o bin/ ./apps/...

  dev:api:
    desc: Run the Go C4ISR server on the host
    env:
      C4ISR_DATABASE_URL: "{{.DATABASE_URL}}"
      C4ISR_ENV: development
      C4ISR_AUTH_REQUIRED: "true"
      C4ISR_AUTH_TOKENS: 'operator-01={{.C4ISR_API_TOKEN | default "dev-operator-token"}}'
      C4ISR_HTTP_ADDR: '{{.C4ISR_HTTP_ADDR | default (printf ":%s" (.C4ISR_DEV_PORT | default "8080"))}}'
    cmds:
      - go run ./apps/c4isr-server

  dev:web:
    desc: Run the Vite operator UI on the host
    dir: apps/operator-ui
    env:
      VITE_API_TOKEN: '{{.C4ISR_API_TOKEN | default "dev-operator-token"}}'
      VITE_LOCAL_AUTO_ENTRY: '{{if .C4ISR_API_TOKEN}}false{{else}}true{{end}}'
      VITE_API_PROXY_TARGET: '{{.C4ISR_API_PROXY_TARGET | default (printf "http://localhost:%s" (.C4ISR_DEV_PORT | default "8080"))}}'
    cmds:
      - pnpm dev

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test ./internal/... ./apps/...

  test:race:
    desc: Run concurrency-sensitive tests with the race detector
    cmds:
      - go test -race ./internal/realtime ./internal/platform/presentation ./internal/platform/access ./internal/platform/httpx ./internal/platform/observability ./internal/scenarios ./internal/telemetry ./internal/tracks ./internal/geospatial ./internal/alerts ./internal/incidents ./internal/missions ./internal/commands ./internal/publicingest ./internal/publicevents ./internal/eventrules ./internal/reference ./internal/simulation ./internal/contextpackage ./internal/exerciseingest ./internal/observations ./internal/sources ./internal/artifacts ./internal/imagery ./internal/imageryanalysis ./internal/assessments ./internal/externaltracks ./internal/publiccontext ./internal/modelassets ./internal/simscene ./internal/simruntime ./internal/nativeexercise ./internal/recordings ./apps/emad-recordings

  test:e2e:
    desc: Run operator UI browser smoke tests (Chromium required)
    cmds:
      - pnpm --dir apps/operator-ui exec playwright test

  test:browser:integration:
    desc: Build the UI and verify public/exercise workflows with PostGIS/S3 (Docker and Chromium required)
    env:
      C4ISR_TEST_INTEGRATION: "1"
      C4ISR_TEST_BROWSER: "1"
    cmds:
      - pnpm --dir apps/operator-ui build
      - go test -count=1 -run TestWorkspaceBrowserCompatibilityGate -v ./internal/integration

  test:integration:
    desc: Run integration tests against real PostgreSQL/PostGIS and S3 (Docker required)
    env:
      C4ISR_TEST_INTEGRATION: "1"
    cmds:
      - go test -count=1 ./internal/integration/...

  ops:validate:
    desc: Validate staging Compose, secret mounts, and observability configuration
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/validate-staging.sh'

  staging:init:
    desc: Generate ignored staging secret files and the local staging env file
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/init-staging.sh'

  staging:up:
    desc: Build and start the production-shaped local staging stack
    deps: [staging:init]
    cmds:
      - "{{.STAGING_COMPOSE}} up -d --build --wait"

  staging:down:
    desc: Stop staging without deleting persistent volumes
    cmds:
      - "{{.STAGING_COMPOSE}} down"

  staging:status:
    desc: Show staging service status
    cmds:
      - "{{.STAGING_COMPOSE}} ps"

  staging:smoke:
    desc: Exercise the staged API, UI, database readiness, and observability endpoints
    cmds:
      - '"{{.SHELL_BIN}}" ./scripts/ops/smoke-staging.sh'

  staging:logs:
    desc: Follow centralized staging logs through Docker
    cmds:
      - "{{.STAGING_COMPOSE}} logs -f --tail=200 api alloy loki"

  lint:
    desc: Vet and formatting checks
    cmd: |
      set -e
      go vet ./...
      unformatted="$(gofmt -l apps internal)"
      if [ -n "$unformatted" ]; then
        echo "$unformatted"
        exit 1
      fi

  contracts:openapi:
    desc: Regenerate browser TypeScript types from the OpenAPI contract
    cmds:
      - pnpm --dir apps/operator-ui contracts:generate

  contracts:buf:
    desc: Lint protobuf contracts with Buf (install Buf separately)
    cmds:
      - buf lint api/proto

  contracts:buf-breaking:
    desc: Check protobuf compatibility against the main branch module
    cmds:
      - >-
        if git ls-tree -r --name-only origin/main -- api/proto | grep -q '\.proto$'; then
        baseline="$(git rev-parse origin/main)";
        buf breaking api/proto --against ".git#ref=$baseline,subdir=api/proto";
        else
        echo "No protobuf baseline exists on main; skipping the initial compatibility comparison.";
        fi

  scenario:list:
    desc: List available scenarios
    cmds:
      - >-
        curl -sS http://localhost:8080/api/v1/scenarios
        -H "Authorization: Bearer {{.C4ISR_API_TOKEN | default \"dev-operator-token\"}}"
        | python3 -m json.tool

  scenario:run:
    desc: Start a scenario by name (NAME=restricted-area-intrusion)
    requires:
      vars: [NAME]
    cmds:
      - >-
        curl -sS -X POST
        "http://localhost:8080/api/v1/scenarios/definitions/{{.NAME}}/start"
        -H "Content-Type: application/json"
        -H "Authorization: Bearer {{.C4ISR_API_TOKEN | default \"dev-operator-token\"}}"
        -d '{"speed": {{.SPEED | default "1"}}}'
        | python3 -m json.tool

  scenario:runs:
    desc: Show recent scenario runs
    cmds:
      - >-
        curl -sS http://localhost:8080/api/v1/scenarios/runs
        -H "Authorization: Bearer {{.C4ISR_API_TOKEN | default \"dev-operator-token\"}}"
        | python3 -m json.tool

  assets:validate:test:
    desc: Verify the bounded portable model import profile
    cmds:
      - pnpm --dir apps/emad-asset-validator test

  simulation:runtime:build:
    desc: Build the independent headless simulation runtime (use -describe to inspect its build)
    cmds:
      - go build -o bin/emad-runtime{{if eq OS "windows"}}.exe{{end}} ./apps/emad-runtime

  simulation:recordings:build:
    desc: Build the independent recording and evaluation worker
    cmds:
      - go build -o bin/emad-recordings{{if eq OS "windows"}}.exe{{end}} ./apps/emad-recordings

  simulation:scene:test:
    desc: Verify spatial, kinematic and no-GPU scene adapters
    cmds:
      - go test ./internal/simscene ./internal/simruntime
      - node apps/operator-ui/scripts/evaluate-headless.mjs three
      - node apps/operator-ui/scripts/evaluate-headless.mjs babylon

  simulation:engine:evaluate:
    desc: Compare the same bounded scene in both rendering candidates
    cmds:
      - node apps/operator-ui/scripts/evaluate-engines.mjs
