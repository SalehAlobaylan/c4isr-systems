global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/environment-target-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: c4isr-environment
    metrics_path: /api/v1/environment-operations/metrics
    authorization:
      credentials_file: /run/secrets/environment_metrics_token
    static_configs:
      - targets: ['api:8080']
