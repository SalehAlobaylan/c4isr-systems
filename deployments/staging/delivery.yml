# Add after staging/docker-compose.yml. Provider credentials are optional and
# remain gated in the trusted connector registry until admitted by a human.
x-worker: &worker
  image: emad-delivery:${C4ISR_VERSION:-staging}
  build:
    context: ../..
    dockerfile: deployments/Dockerfile.workers
    args:
      EMAD_PRODUCT_PROFILE: ${C4ISR_PRODUCT_PROFILE:-map}
  environment: &worker-env
    C4ISR_PRODUCT_PROFILE: ${C4ISR_PRODUCT_PROFILE:-map}
    C4ISR_ENV: staging
    C4ISR_DATABASE_AUTH: 'true'
    C4ISR_DATABASE_URL_FILE: /run/secrets/database_url
    C4ISR_ARTIFACT_S3_ENDPOINT: http://garage:3900
    C4ISR_ARTIFACT_S3_ALLOW_HTTP: 'true' # isolated Compose network; no host port
    C4ISR_ARTIFACT_S3_BUCKET: ${EMAD_BUCKET:-emad-staging}
    C4ISR_ARTIFACT_S3_REGION: garage
    C4ISR_ARTIFACT_S3_ACCESS_KEY_FILE: /run/secrets/object_access_key
    C4ISR_ARTIFACT_S3_SECRET_KEY_FILE: /run/secrets/object_secret_key
    C4ISR_PUBLIC_CONNECTORS_FILE: /run/secrets/connectors.json
    C4ISR_RUNTIME_BUILDS_FILE: /app/bin/runtime-builds.txt
    EMAD_API_URL: http://api:8080
  secrets:
    - database_url
    - object_access_key
    - object_secret_key
    - source: connectors
      target: connectors.json
  depends_on:
    api: {condition: service_healthy}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]

services:
  api:
    image: emad-delivery:${C4ISR_VERSION:-staging}
    build:
      context: ../..
      dockerfile: deployments/Dockerfile.workers
      args:
        EMAD_PRODUCT_PROFILE: ${C4ISR_PRODUCT_PROFILE:-map}
    entrypoint: [/app/bin/c4isr-server]
    environment:
      <<: *worker-env
      C4ISR_HTTP_ADDR: :8080
      C4ISR_ENVIRONMENT_LIBRARY_ENABLED: ${C4ISR_ENVIRONMENT_LIBRARY_ENABLED:-false}
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_ENRICHMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_ENRICHMENT_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_OBSERVATION_TOOLCHAIN: ${C4ISR_ENVIRONMENT_OBSERVATION_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_COASTAL_TOOLCHAIN: ${C4ISR_ENVIRONMENT_COASTAL_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_DISPLAY_TOOLCHAIN: ${C4ISR_ENVIRONMENT_DISPLAY_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_LAYER_TOOLCHAIN: ${C4ISR_ENVIRONMENT_LAYER_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/environment-api
    volumes: [emad-staging-environment-api-scratch:/data]
    secrets:
      - object_access_key
      - object_secret_key
      - source: connectors
        target: connectors.json
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
    depends_on:
      garage: {condition: service_started}
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: [/garage, server, --single-node, --default-bucket]
    env_file: ${STAGING_SECRET_DIR:-./.secrets}/garage.env
    volumes:
      - ${STAGING_SECRET_DIR:-./.secrets}/garage.toml:/etc/garage.toml:ro
      - emad-staging-objects:/var/lib/garage/data
      - emad-staging-object-meta:/var/lib/garage/meta
    restart: unless-stopped
  imagery:
    <<: *worker
    command: [--name, worker-imagery, --feature, imagery, --, /app/bin/emad-imagery, -token-file, /run/secrets/worker-imagery.token]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: imagery_worker
        target: worker-imagery.token
  assets:
    profiles: [historical-full]
    <<: *worker
    command: [--name, worker-assets, --feature, assets, --, /app/bin/emad-assets, -token-file, /run/secrets/worker-assets.token]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: asset_worker
        target: worker-assets.token
  recordings:
    profiles: [historical-full]
    <<: *worker
    command: [--name, worker-recordings, --feature, recordings, --, /app/bin/emad-recordings, -token-file, /run/secrets/worker-recordings.token]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: recording_worker
        target: worker-recordings.token
  runtime:
    profiles: [historical-full]
    <<: *worker
    network_mode: service:api
    environment:
      EMAD_API_URL: http://127.0.0.1:8080
    command: [--name, worker-runtime, --feature, runtime, --, /app/bin/emad-runtime, -worker, -url, http://127.0.0.1:8080, -token-file, /run/secrets/worker-runtime.token]
    secrets:
      - source: runtime_worker
        target: worker-runtime.token
  preparation:
    <<: *worker
    command: [--name, worker-preparation, --feature, preparation, --, python, /app/scripts/data/capture_worker.py]
    volumes: [emad-staging-preparation:/data]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: preparation_worker
        target: worker-preparation.token
      - source: imagery_worker
        target: worker-imagery.token
  case-delivery:
    <<: *worker
    profiles: [case-delivery]
    entrypoint: [/app/bin/emad-delivery]
    command: [-token-file, /run/secrets/delivery-author.token]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: delivery_author
        target: delivery-author.token
  environment-library:
    <<: *worker
    profiles: [environment-library]
    entrypoint: [/app/bin/emad-environment]
    command: [-token-file, /run/secrets/worker-environment.token, -processor, /app/scripts/data/environment_library.py]
    environment:
      <<: *worker-env
      C4ISR_PUBLIC_CONNECTORS_FILE: ''
      C4ISR_ENVIRONMENT_LIBRARY_ENABLED: ${C4ISR_ENVIRONMENT_LIBRARY_ENABLED:-false}
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_DISPLAY_TOOLCHAIN: ${C4ISR_ENVIRONMENT_DISPLAY_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_LAYER_TOOLCHAIN: ${C4ISR_ENVIRONMENT_LAYER_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/attempts
    mem_limit: 2304m
    volumes: [emad-staging-environment-scratch:/data]
    deploy:
      replicas: 2
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: environment_worker
        target: worker-environment.token
  environment-enrichment:
    <<: *worker
    profiles: [environment-enrichment]
    entrypoint: [/app/bin/emad-environment]
    command: [-token-file, /run/secrets/worker-enrichment.token, -processor, /app/scripts/data/environment_enrichment.py]
    environment:
      <<: *worker-env
      C4ISR_PUBLIC_CONNECTORS_FILE: ''
      C4ISR_ENVIRONMENT_LIBRARY_ENABLED: ${C4ISR_ENVIRONMENT_LIBRARY_ENABLED:-false}
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_ENRICHMENT_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/enrichment
    mem_limit: 2304m
    volumes: [emad-staging-enrichment-scratch:/data]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: enrichment_worker
        target: worker-enrichment.token
  environment-observation:
    <<: *worker
    profiles: [environment-observation]
    entrypoint: [/app/bin/emad-environment]
    command: [-token-file, /run/secrets/worker-observation.token, -processor, /app/scripts/data/environment_observation.py]
    environment:
      <<: *worker-env
      C4ISR_PUBLIC_CONNECTORS_FILE: ''
      C4ISR_ENVIRONMENT_LIBRARY_ENABLED: ${C4ISR_ENVIRONMENT_LIBRARY_ENABLED:-false}
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_OBSERVATION_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/observation
    mem_limit: 2304m
    volumes: [emad-staging-observation-scratch:/data]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: observation_worker
        target: worker-observation.token
  environment-coastal:
    <<: *worker
    profiles: [environment-coastal]
    entrypoint: [/app/bin/emad-environment]
    command: [-token-file, /run/secrets/worker-coastal.token, -processor, /app/scripts/data/environment_coastal.py]
    environment:
      <<: *worker-env
      C4ISR_PUBLIC_CONNECTORS_FILE: ''
      C4ISR_ENVIRONMENT_LIBRARY_ENABLED: ${C4ISR_ENVIRONMENT_LIBRARY_ENABLED:-false}
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_COASTAL_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/coastal
    mem_limit: 1024m
    volumes: [emad-staging-coastal-scratch:/data]
    secrets:
      - database_url
      - object_access_key
      - object_secret_key
      - source: coastal_worker
        target: worker-coastal.token
  environment-http: &environment-http
    image: emad-delivery:${C4ISR_VERSION:-staging}
    profiles: [environment-http]
    entrypoint: [/app/bin/emad-environment]
    command: [-api-origin, '${C4ISR_ENVIRONMENT_WORKER_API_ORIGIN:-http://api:8080}', -token-file, /run/secrets/worker-environment-http.token, -processor, /app/scripts/data/environment_library.py]
    environment:
      C4ISR_ENVIRONMENT_TOOLCHAIN: ${C4ISR_ENVIRONMENT_TOOLCHAIN:-}
      C4ISR_ENVIRONMENT_SPOOL: /data/attempts
    secrets:
      - source: environment_http_worker
        target: worker-environment-http.token
    read_only: true
    volumes: [emad-staging-environment-http-scratch:/data]
    tmpfs: [/tmp]
    mem_limit: 2304m
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  environment-http-secondary:
    <<: *environment-http
    volumes: [emad-staging-environment-http-secondary-scratch:/data]
    secrets:
      - source: environment_http_secondary_worker
        target: worker-environment-http.token
  environment-prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [environment-observability]
    command: [--config.file=/etc/prometheus/prometheus-environment.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - ../observability/prometheus-environment.yml:/etc/prometheus/prometheus-environment.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../observability/environment-target-alerts.yml:/etc/prometheus/environment-target-alerts.yml:ro
      - emad-staging-environment-metrics:/prometheus
    secrets:
      - environment_metrics_token
    restart: unless-stopped
  connectors:
    <<: *worker
    # One exact-source identity per instance. Create separate services for each
    # additional binding; do not give one process every provider's credential.
    command: [--name, worker-usgs, --feature, connectors, --, /app/bin/emad-connectors, -token-file, /run/secrets/worker-usgs.token, -source, '${EMAD_CONNECTOR_SOURCE_ID}']
    secrets:
      - database_url
      - source: connectors
        target: connectors.json
      - source: connector_worker
        target: worker-usgs.token

volumes:
  emad-staging-objects:
  emad-staging-object-meta:
  emad-staging-preparation:
  emad-staging-environment-scratch:
  emad-staging-environment-api-scratch:
  emad-staging-environment-http-scratch:
  emad-staging-environment-http-secondary-scratch:
  emad-staging-enrichment-scratch:
  emad-staging-observation-scratch:
  emad-staging-coastal-scratch:
  emad-staging-environment-metrics:
secrets:
  object_access_key: {file: '${STAGING_SECRET_DIR:-./.secrets}/object_access_key'}
  object_secret_key: {file: '${STAGING_SECRET_DIR:-./.secrets}/object_secret_key'}
  connectors: {file: '${STAGING_SECRET_DIR:-./.secrets}/connectors.json'}
  imagery_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-imagery.token'}
  asset_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-assets.token'}
  runtime_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-runtime.token'}
  recording_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-recordings.token'}
  preparation_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-preparation.token'}
  connector_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-usgs.token'}

  delivery_author: {file: '${STAGING_SECRET_DIR:-./.secrets}/delivery-author.token'}
  environment_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-environment.token'}
  enrichment_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-enrichment.token'}
  observation_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-observation.token'}
  coastal_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-coastal.token'}
  environment_http_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-environment-http.token'}
  environment_http_secondary_worker: {file: '${STAGING_SECRET_DIR:-./.secrets}/worker-environment-http-secondary.token'}
  environment_metrics_token: {file: '${STAGING_SECRET_DIR:-./.secrets}/environment-metrics.token'}
