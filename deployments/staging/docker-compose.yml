name: ${COMPOSE_PROJECT_NAME:-c4isr-staging}

services:
  postgres:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: c4isr
      POSTGRES_DB: c4isr
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - c4isr-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4isr -d c4isr"]
      interval: 5s
      timeout: 3s
      retries: 24

  migrate:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile.server
      args:
        C4ISR_VERSION: ${C4ISR_VERSION:-staging}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        goose -dir /app/db/migrations postgres
        "$$(cat /run/secrets/database_url)" up
    environment:
      C4ISR_ENV: staging
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile.server
      args:
        C4ISR_VERSION: ${C4ISR_VERSION:-staging}
    environment:
      C4ISR_ENV: staging
      C4ISR_HTTP_ADDR: :8080
      C4ISR_DATABASE_URL_FILE: /run/secrets/database_url
      C4ISR_AUTH_TOKENS_FILE: /run/secrets/auth_tokens
      C4ISR_LOG_LEVEL: info
      C4ISR_LOG_FORMAT: json
      C4ISR_SCENARIOS_DIR: /app/scenarios
      C4ISR_TELEMETRY_STALE_AFTER: ${C4ISR_TELEMETRY_STALE_AFTER:-5m}
      C4ISR_ALLOWED_ORIGINS: ${C4ISR_ALLOWED_ORIGINS:-http://localhost:8081}
    secrets:
      - database_url
      - auth_tokens
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ui:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile.ui
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    environment:
      C4ISR_UI_API_BASE_URL: ${C4ISR_UI_API_BASE_URL:-/api/v1}
      VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
      C4ISR_UI_TOKEN_FILE: /run/secrets/ui_token
    secrets:
      - ui_token
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - c4isr-staging-prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - c4isr-staging-alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../observability/loki-config.yml:/etc/loki/config.yml:ro
      - c4isr-staging-loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - c4isr-staging-alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:12345:12345"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    secrets:
      - grafana_admin_password
    volumes:
      - c4isr-staging-grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

volumes:
  c4isr-staging-postgres:
  c4isr-staging-prometheus:
  c4isr-staging-alertmanager:
  c4isr-staging-loki:
  c4isr-staging-alloy:
  c4isr-staging-grafana:

secrets:
  postgres_password:
    file: ${STAGING_SECRET_DIR:-./.secrets}/postgres_password
  database_url:
    file: ${STAGING_SECRET_DIR:-./.secrets}/database_url
  auth_tokens:
    file: ${STAGING_SECRET_DIR:-./.secrets}/auth_tokens
  ui_token:
    file: ${STAGING_SECRET_DIR:-./.secrets}/ui_token
  grafana_admin_password:
    file: ${STAGING_SECRET_DIR:-./.secrets}/grafana_admin_password

configs:
  alertmanager_config:
    content: |
      global:
        resolve_timeout: 5m
      route:
        receiver: operations-webhook
        group_by: [alertname, service, component]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: operations-webhook
          webhook_configs:
            - url: ${ALERTMANAGER_WEBHOOK_URL:-http://host.docker.internal:9094/alerts}
              send_resolved: true
