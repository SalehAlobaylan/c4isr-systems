syntax = "proto3";

package c4isr.ingestion.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/SalehAlobaylan/c4isr-systems/api/proto/gen/go/c4isr/ingestion/v1;ingestionv1";

// ObservationIngestionService is the stable machine contract for external
// sources. The core still uses the same application service when receiving
// HTTP observations or scenario data.
service ObservationIngestionService {
  rpc IngestObservation(IngestObservationRequest) returns (IngestObservationResponse);
}

// TelemetryIngestionService is the stable machine contract for controlled
// asset telemetry gateways.
service TelemetryIngestionService {
  rpc IngestTelemetry(IngestTelemetryRequest) returns (IngestTelemetryResponse);
}

// ResourceContext selects a resource; it is not an identity or grant. A future
// gRPC adapter must authenticate metadata, validate server-owned grants, and bind
// the same application context as REST before invoking domain services. The
// current server has no gRPC listener. Omission is only permitted when the adapter
// has a credential-bound default; payload metadata can never supply ownership.
message ResourceContext {
  uint32 version = 1; // Must be 1 when this message is supplied.
  string workspace_id = 2;
  string environment_id = 3;
  DataPartition partition = 4;
  string run_id = 5;
}

enum DataPartition {
  DATA_PARTITION_UNSPECIFIED = 0;
  DATA_PARTITION_PUBLIC_EVIDENCE = 1;
  DATA_PARTITION_EXERCISE_INPUT = 2;
  DATA_PARTITION_EXERCISE_OBSERVATION = 3;
  DATA_PARTITION_EXERCISE_TRUTH = 4;
}

message Point {
  double latitude = 1;
  double longitude = 2;
}

message IngestObservationRequest {
  string id = 1;
  string source_id = 2;
  string observation_type = 3;
  google.protobuf.Timestamp observed_at = 4;
  Point position = 5;
  google.protobuf.Struct payload = 6;
  google.protobuf.Struct quality = 7;
  string track_hint = 8;
  ResourceContext resource = 9;
}

message IngestTelemetryRequest {
  string message_id = 1;
  string asset_id = 2;
  string source_id = 3;
  google.protobuf.Timestamp observed_at = 4;
  Point position = 5;
  optional double speed_mps = 6;
  optional double heading_degrees = 7;
  string health = 8;
  string connection_state = 9;
  google.protobuf.Struct payload = 10;
  ResourceContext resource = 11;
}

message IngestObservationResponse {
  string id = 1;
  bool duplicate = 2;
  bool stale = 3;
  google.protobuf.Timestamp received_at = 4;
}

message IngestTelemetryResponse {
  string id = 1;
  bool duplicate = 2;
  bool stale = 3;
  google.protobuf.Timestamp received_at = 4;
}
