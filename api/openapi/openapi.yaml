          type: object
          description: Last reported OpenSky states balance. An absent header produces null, never the configured daily allowance.
          required: [bucket, remaining, reportedAt]
          properties:
            bucket: {type: string, enum: [states]}
            remaining: {type: [integer, 'null'], minimum: 0, maximum: 1000000000}
            reportedAt: {type: [string, 'null'], format: date-time}
        sourceId:
          type: string
        state:
          type: string
        reason:
          type: string
        nextAction:
          type: string
        health:
          $ref: '#/components/schemas/SourceIngestionSummary'
    SpatialReplayFrame:
