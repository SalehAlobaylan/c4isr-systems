openapi: 3.1.0
info:
  title: C4ISR Operational Platform API
  version: 1.0.0
  license:
    name: Internal use
    identifier: LicenseRef-Internal
  description: |
    Versioned browser contract for the C2 and operational-awareness core.
    Observations and telemetry are evidence/ingestion boundaries; tracks and
    assets are current operational projections.
servers:
  - url: http://{host}:{port}
    description: Local development
    variables:
      host: { default: localhost }
      port: { default: '8080' }
tags:
  - { name: system, description: 'Service health, metrics, and realtime delivery.' }
  - { name: identity, description: 'Operator identity and access.' }
  - { name: sources, description: 'Information source registration and status.' }
  - { name: observations, description: 'Append-only observation evidence.' }
  - { name: assets, description: 'Controlled assets and telemetry.' }
  - { name: tracks, description: 'Derived tracks and analytical hypotheses.' }
  - { name: geospatial, description: 'Geofences and spatial queries.' }
  - { name: alerts, description: 'Operational alerts and acknowledgments.' }
  - { name: incidents, description: 'Incident coordination and relations.' }
  - { name: missions, description: 'Mission planning and task execution.' }
  - { name: commands, description: 'Asset command lifecycle.' }
  - { name: assessments, description: 'Analytical assessments and evidence.' }
  - { name: audit, description: 'Immutable operational history.' }
  - { name: scenarios, description: 'Deterministic scenario replay control.' }
paths:
  /health:
    get:
      tags: [system]
      security: []
      operationId: getHealth
      summary: Get health
      responses:
        '200':
          description: Service and database health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: Database unavailable; the service returns its degraded health payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /metrics:
    get:
      tags: [system]
      security: []
      operationId: getMetrics
      summary: Get metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/me:
    get:
      tags: [identity]
      operationId: getCurrentOperator
      summary: Get current operator
      responses:
        '200':
          description: Authenticated operator and effective permissions
          content:
            application/json:
              schema:
                type: object
                required: [operator, permissions]
                properties:
                  operator: { $ref: '#/components/schemas/CurrentOperator' }
                  permissions:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: List sources
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/SourceList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [sources]
      operationId: createSource
      summary: Create source
      requestBody: { $ref: '#/components/requestBodies/Source' }
      responses: { '201': { $ref: '#/components/responses/Source' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/sources/{id}:
    get:
      tags: [sources]
      operationId: getSource
      summary: Get source
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Source' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/sources/{id}/status:
    post:
      tags: [sources]
      operationId: updateSourceStatus
      summary: Update source status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, degraded, offline] } }
      responses: { '200': { $ref: '#/components/responses/Source' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/observations:
    get:
      tags: [observations]
      operationId: listObservations
      summary: List observations
      parameters:
        - { $ref: '#/components/parameters/TrackId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses: { '200': { $ref: '#/components/responses/ObservationList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [observations]
      operationId: ingestObservation
      summary: Ingest observation
      requestBody: { $ref: '#/components/requestBodies/ObservationInput' }
      responses:
        '201': { $ref: '#/components/responses/Observation' }
        '200': { $ref: '#/components/responses/Observation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/observations/{id}:
    get:
      tags: [observations]
      operationId: getObservation
      summary: Get observation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Observation' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: List assets
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/AssetList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [assets]
      operationId: createAsset
      summary: Create asset
      requestBody: { $ref: '#/components/requestBodies/Asset' }
      responses: { '201': { $ref: '#/components/responses/Asset' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/assets/{id}:
    get:
      tags: [assets]
      operationId: getAsset
      summary: Get asset
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Asset' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/assets/{id}/status:
    post:
      tags: [assets]
      operationId: updateAssetStatus
      summary: Update asset status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [available, assigned, unavailable, offline, maintenance] } }
      responses: { '200': { $ref: '#/components/responses/Asset' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/assets/{id}/telemetry:
    get:
      tags: [assets]
      operationId: listAssetTelemetry
      summary: List asset telemetry
      parameters: [{ $ref: '#/components/parameters/Id' }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/TelemetryList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/telemetry:
    post:
      tags: [assets]
      operationId: ingestTelemetry
      summary: Ingest telemetry
      requestBody: { $ref: '#/components/requestBodies/TelemetryInput' }
      responses:
        '201': { $ref: '#/components/responses/Telemetry' }
        '200': { $ref: '#/components/responses/Telemetry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tracks:
    get:
      tags: [tracks]
      operationId: listTracks
      summary: List tracks
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/TrackList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/tracks/{id}:
    get:
      tags: [tracks]
      operationId: getTrack
      summary: Get track
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Track' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/tracks/{id}/history:
    get:
      tags: [tracks]
      operationId: getTrackHistory
      summary: Get track history
      parameters: [{ $ref: '#/components/parameters/Id' }, {$ref: '#/components/parameters/Limit'}]
      responses: { '200': { $ref: '#/components/responses/TrackHistoryList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/tracks/{id}/classifications:
    get:
      tags: [tracks]
      operationId: listTrackClassifications
      summary: List track classifications
      parameters: [{ $ref: '#/components/parameters/Id' }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/ClassificationList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/classifications:
    post:
      tags: [tracks]
      operationId: createClassification
      summary: Create classification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, label]
              properties:
                trackId: { type: string }
                label: { type: string }
                confidence: { type: number, minimum: 0, maximum: 1 }
                method: { type: string, enum: [SCENARIO, OPERATOR, RULE, ALGORITHM, AI] }
                sourceReference: { type: string }
      responses: { '201': { $ref: '#/components/responses/Classification' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/classifications/{id}:
    get:
      tags: [tracks]
      operationId: getClassification
      summary: Get classification
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Classification' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/geofences:
    get:
      tags: [geospatial]
      operationId: listGeofences
      summary: List geofences
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/GeofenceList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [geospatial]
      operationId: createGeofence
      summary: Create geofence
      requestBody: { $ref: '#/components/requestBodies/Geofence' }
      responses: { '201': { $ref: '#/components/responses/Geofence' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/geofences/{id}:
    get:
      tags: [geospatial]
      operationId: getGeofence
      summary: Get geofence
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Geofence' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/geofences/{id}/active:
    post:
      tags: [geospatial]
      operationId: setGeofenceActive
      summary: Set geofence active state
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties: { active: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/Geofence' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/geospatial/geofences-containing:
    get:
      tags: [geospatial]
      operationId: listContainingGeofences
      summary: List containing geofences
      parameters: [{ $ref: '#/components/parameters/Lat' }, { $ref: '#/components/parameters/Lng' }]
      responses: { '200': { $ref: '#/components/responses/GeofenceList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/geospatial/assets-within:
    get:
      tags: [geospatial]
      operationId: listAssetsWithin
      summary: List assets within
      parameters: [{ $ref: '#/components/parameters/Lat' }, { $ref: '#/components/parameters/Lng' }, { $ref: '#/components/parameters/RadiusM' }]
      responses: { '200': { $ref: '#/components/responses/AssetWithinList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/geospatial/nearest-assets:
    get:
      tags: [geospatial]
      operationId: listNearestAssets
      summary: List nearest assets
      parameters: [{ $ref: '#/components/parameters/Lat' }, { $ref: '#/components/parameters/Lng' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/AssetWithinList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: track_id, in: query, schema: { type: string } }
        - { name: incident_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses: { '200': { $ref: '#/components/responses/AlertList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/alerts/{id}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Get alert
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Alert' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/alerts/{id}/acknowledge:
    post:
      tags: [alerts]
      operationId: acknowledgeAlert
      summary: Acknowledge alert
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Alert' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/alerts/{id}/resolve:
    post:
      tags: [alerts]
      operationId: resolveAlert
      summary: Resolve alert
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Alert' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List incidents
      parameters: [{ name: status, in: query, schema: { type: string } }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/IncidentList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [incidents]
      operationId: createIncident
      summary: Create incident
      requestBody: { $ref: '#/components/requestBodies/Incident' }
      responses: { '201': { $ref: '#/components/responses/Incident' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/incidents/{id}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Get incident
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/IncidentDetail' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [incidents]
      operationId: updateIncident
      summary: Update incident metadata
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high, critical] }
                assignedOperator: { type: string }
      responses: { '200': { $ref: '#/components/responses/Incident' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/incidents/{id}/status:
    post:
      tags: [incidents]
      operationId: updateIncidentStatus
      summary: Update incident status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Incident' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/incidents/{id}/relations:
    post:
      tags: [incidents]
      operationId: attachIncidentRelation
      summary: Attach incident relation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties: { kind: { type: string }, id: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Incident' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/missions:
    get:
      tags: [missions]
      operationId: listMissions
      summary: List missions
      parameters: [{ name: status, in: query, schema: { type: string } }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/MissionList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [missions]
      operationId: createMission
      summary: Create mission
      requestBody: { $ref: '#/components/requestBodies/Mission' }
      responses: { '201': { $ref: '#/components/responses/Mission' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/missions/{id}:
    get:
      tags: [missions]
      operationId: getMission
      summary: Get mission
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Mission' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/missions/{id}/status:
    post:
      tags: [missions]
      operationId: updateMissionStatus
      summary: Update mission status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Mission' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/missions/{id}/assets:
    post:
      tags: [missions]
      operationId: assignMissionAsset
      summary: Assign mission asset
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [assetId], properties: { assetId: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Mission' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/missions/{id}/tasks:
    post:
      tags: [missions]
      operationId: addMissionTask
      summary: Add mission task
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
                description: { type: string }
                target: { $ref: '#/components/schemas/Point' }
      responses: { '201': { $ref: '#/components/responses/MissionTask' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/missions/{id}/tasks/{taskId}/status:
    post:
      tags: [missions]
      operationId: updateMissionTaskStatus
      summary: Update mission task status
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [PENDING, ACTIVE, COMPLETED, FAILED, CANCELLED] } }
      responses: { '200': { $ref: '#/components/responses/MissionTask' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/commands:
    get:
      tags: [commands]
      operationId: listCommands
      summary: List commands
      parameters: [{ name: asset_id, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }, { name: mission_id, in: query, schema: { type: string } }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/CommandList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [commands]
      operationId: issueCommand
      summary: Issue command
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '201': { $ref: '#/components/responses/Command' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/commands/{id}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Get command
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Command' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/commands/{id}/transition:
    post:
      tags: [commands]
      operationId: transitionCommand
