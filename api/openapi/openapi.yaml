          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        attempt:
          type: integer
        progress:
          type: string
        errorCode:
          type: string
        result:
          $ref: '#/components/schemas/ImageryCaptureResult'
        createdAt:
          type: string
