      parameters: [{ name: subject_type, in: query, schema: { type: string } }, { name: subject_id, in: query, schema: { type: string } }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/AssessmentList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [assessments]
      operationId: createAssessment
      summary: Create assessment
      requestBody: { $ref: '#/components/requestBodies/Assessment' }
      responses: { '201': { $ref: '#/components/responses/Assessment' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/assessments/{id}:
    get:
      tags: [assessments]
      operationId: getAssessment
      summary: Get assessment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Assessment' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List audit
      parameters: [{ name: subject_type, in: query, schema: { type: string } }, { name: subject_id, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string } }, { name: since, in: query, schema: { type: string, format: date-time } }, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/AuditList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/operators:
    get:
      tags: [identity]
      operationId: listOperators
      summary: List operators
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/OperatorList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [identity]
      operationId: createOperator
      summary: Create operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties: { id: { type: string }, name: { type: string }, role: { type: string, enum: [operator, supervisor, administrator, analyst] } }
      responses: { '201': { $ref: '#/components/responses/Operator' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/operators/{id}:
    get:
      tags: [identity]
      operationId: getOperator
      summary: Get operator
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Operator' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      summary: List scenarios
      responses: { '200': { $ref: '#/components/responses/ScenarioSummaryList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/scenarios/{name}:
    get:
      tags: [scenarios]
      operationId: getScenario
      summary: Get scenario
      parameters: [{ $ref: '#/components/parameters/ScenarioName' }]
      responses: { '200': { description: Parsed scenario, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/scenarios/definitions/{name}/start:
    post:
      tags: [scenarios]
      operationId: startScenario
      summary: Start scenario
      parameters: [{ $ref: '#/components/parameters/ScenarioName' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { speed: { type: number, minimum: 0 }, seed: { type: integer, format: int64 } } }
      responses: { '201': { $ref: '#/components/responses/ScenarioRun' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/scenarios/runs:
    get:
      tags: [scenarios]
      operationId: listScenarioRuns
      summary: List scenario runs
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: { '200': { $ref: '#/components/responses/ScenarioRunList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/scenarios/runs/{id}:
    get:
      tags: [scenarios]
      operationId: getScenarioRun
      summary: Get scenario run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/scenarios/runs/{id}/events:
    get:
      tags: [scenarios]
      operationId: inspectScenarioRunEvents
      summary: Inspect scenario run events
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/ScenarioEventList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/scenarios/runs/{id}/pause:
    post:
      tags: [scenarios]
      operationId: pauseScenarioRun
      summary: Pause scenario run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/scenarios/runs/{id}/resume:
    post:
      tags: [scenarios]
      operationId: resumeScenarioRun
      summary: Resume scenario run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/scenarios/runs/{id}/stop:
    post:
      tags: [scenarios]
      operationId: stopScenarioRun
      summary: Stop scenario run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/scenarios/runs/{id}/speed:
    post:
      tags: [scenarios]
      operationId: setScenarioRunSpeed
      summary: Set scenario run speed
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [speed], properties: { speed: { type: number, exclusiveMinimum: 0 } } }
      responses: { '200': { $ref: '#/components/responses/ScenarioRun' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/scenarios/runs/{id}/restart:
    post:
      tags: [scenarios]
      operationId: restartScenarioRun
      summary: Restart scenario run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '201': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/realtime:
    get:
      tags: [system]
      security: [{ BearerAuth: [] }]
      description: WebSocket endpoint. Browser clients pass the bearer token as access_token during upgrade.
      operationId: realtime
      summary: Realtime
      responses:
        '101': { description: WebSocket upgrade }
        '200': { description: WebSocket negotiation response }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    ScenarioName: { name: name, in: path, required: true, schema: { type: string, pattern: '^(?!runs$)[A-Za-z0-9][A-Za-z0-9_-]*$' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    TrackId: { name: track_id, in: query, schema: { type: string } }
    Lat: { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
    Lng: { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
    RadiusM: { name: radius_m, in: query, required: true, schema: { type: number, exclusiveMinimum: 0 } }
  requestBodies:
    Source:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type]
            properties: { id: { type: string }, name: { type: string }, type: { type: string, enum: [synthetic, operator, external, sensor] }, metadata: { type: object, additionalProperties: true } }
    ObservationInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sourceId, type, observedAt]
            properties:
              id: { type: string }
              sourceId: { type: string }
              type: { type: string }
              observedAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              position: { $ref: '#/components/schemas/Point' }
              payload: { type: object, additionalProperties: true }
              quality: { type: object, additionalProperties: true }
              trackHint: { type: string }
    TelemetryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assetId, observedAt]
            properties:
              messageId: { type: string }
              assetId: { type: string }
              sourceId: { type: string }
              observedAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              position: { $ref: '#/components/schemas/Point' }
              speed: { type: number }
              heading: { type: number }
              health: { type: string }
              connectionState: { type: string }
              payload: { type: object, additionalProperties: true }
    Asset:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type]
            properties: { id: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, capabilities: { type: array, items: { type: string } }, metadata: { type: object, additionalProperties: true } }
    Geofence:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type, polygon]
            properties: { id: { type: string }, name: { type: string }, type: { type: string }, severity: { type: string }, polygon: { type: array, minItems: 3, items: { $ref: '#/components/schemas/Point' } } }
    Incident:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties: { title: { type: string }, description: { type: string }, priority: { type: string }, alertIds: { type: array, items: { type: string } }, trackIds: { type: array, items: { type: string } }, assetIds: { type: array, items: { type: string } }, observationIds: { type: array, items: { type: string } }, assessmentIds: { type: array, items: { type: string } } }
    Mission:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties: { name: { type: string }, objective: { type: string }, priority: { type: string }, incidentId: { type: string }, assets: { type: array, items: { type: string } }, tasks: { type: array, items: { type: object, properties: { type: { type: string }, description: { type: string }, target: { $ref: '#/components/schemas/Point' } } } } }
    Command:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assetId, type]
            properties: { assetId: { type: string }, missionId: { type: string }, incidentId: { type: string }, type: { type: string }, payload: { type: object, additionalProperties: true } }
    Assessment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subjectType, subjectId, type, conclusion]
            properties: { subjectType: { type: string }, subjectId: { type: string }, type: { type: string }, conclusion: { type: string }, confidence: { type: number, minimum: 0, maximum: 1 }, method: { type: string }, createdBy: { type: string }, evidence: { type: array, items: { type: object, required: [type, id], properties: { type: { type: string }, id: { type: string } } } } }
  schemas:
    Point:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number, minimum: -90, maximum: 90 }, lng: { type: number, minimum: -180, maximum: 180 } }
    Health:
      type: object
      required: [status, database, time]
      properties: { status: { type: string }, database: { type: string }, time: { type: string, format: date-time } }
    Source:
      type: object
      required: [id, name, type, status, metadata, createdAt, updatedAt]
      properties: { id: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, metadata: { type: object, additionalProperties: true }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    Observation:
      type: object
      required: [id, sourceId, type, observedAt, receivedAt, payload, createdAt]
      properties: { id: { type: string }, sourceId: { type: string }, type: { type: string }, observedAt: { type: string, format: date-time }, receivedAt: { type: string, format: date-time }, processedAt: { type: string, format: date-time }, position: { $ref: '#/components/schemas/Point' }, payload: { type: object, additionalProperties: true }, quality: { type: object, additionalProperties: true }, trackHint: { type: string }, createdAt: { type: string, format: date-time }, duplicate: { type: boolean } }
    Asset:
      type: object
      required: [id, name, type, status, capabilities, metadata, speed, heading, health, connectionState, lastSeenAt, createdAt, updatedAt]
      properties: { id: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, capabilities: { type: array, items: { type: string } }, metadata: { type: object, additionalProperties: true }, position: { $ref: '#/components/schemas/Point' }, speed: { type: [number, 'null'] }, heading: { type: [number, 'null'] }, health: { type: string }, connectionState: { type: string }, lastSeenAt: { type: [string, 'null'], format: date-time }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    Telemetry:
      type: object
      properties: { id: { type: string }, messageId: { type: string }, assetId: { type: string }, sourceId: { type: string }, observedAt: { type: string, format: date-time }, receivedAt: { type: string, format: date-time }, position: { $ref: '#/components/schemas/Point' }, speed: { type: number }, heading: { type: number }, health: { type: string }, connectionState: { type: string }, payload: { type: object, additionalProperties: true }, stale: { type: boolean }, duplicate: { type: boolean } }
    Track:
      type: object
      required: [id, externalRef, status, firstSeenAt, lastSeenAt, position, speed, heading, metadata, createdAt, updatedAt, closedAt, observationCount]
      properties: { id: { type: string }, externalRef: { type: string }, status: { type: string }, position: { oneOf: [{ $ref: '#/components/schemas/Point' }, { type: 'null' }] }, speed: { type: [number, 'null'] }, heading: { type: [number, 'null'] }, firstSeenAt: { type: string, format: date-time }, lastSeenAt: { type: string, format: date-time }, metadata: { type: object, additionalProperties: true }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, closedAt: { type: [string, 'null'], format: date-time }, observationCount: { type: integer } }
    TrackHistoryPoint:
      type: object
      required: [id, observedAt, position, speed, heading]
      properties: { id: { type: string }, observedAt: { type: string, format: date-time }, position: { oneOf: [{ $ref: '#/components/schemas/Point' }, { type: 'null' }] }, speed: { type: [number, 'null'] }, heading: { type: [number, 'null'] } }
    Classification:
      type: object
      required: [id, trackId, label, confidence, method, sourceReference, createdBy, createdAt]
      properties: { id: { type: string }, trackId: { type: string }, label: { type: string }, confidence: { type: [number, 'null'] }, method: { type: string }, sourceReference: { type: string }, createdBy: { type: string }, createdAt: { type: string, format: date-time } }
    Geofence:
      type: object
      required: [id, name, type, severity, active, geojson, metadata, createdAt, updatedAt]
      properties: { id: { type: string }, name: { type: string }, type: { type: string }, severity: { type: string }, active: { type: boolean }, geojson: { type: string }, metadata: { type: object, additionalProperties: true }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    Alert:
      type: object
      required: [id, type, severity, state, title, message, sourceReference, trackId, assetId, geofenceId, incidentId, createdAt, updatedAt, acknowledgedAt, acknowledgedBy, resolvedAt, resolvedBy]
      properties: { id: { type: string }, type: { type: string }, severity: { type: string }, state: { type: string }, title: { type: string }, message: { type: string }, sourceReference: { type: object, additionalProperties: true }, trackId: { type: string }, assetId: { type: string }, geofenceId: { type: string }, incidentId: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, acknowledgedAt: { type: [string, 'null'], format: date-time }, acknowledgedBy: { type: string }, resolvedAt: { type: [string, 'null'], format: date-time }, resolvedBy: { type: string } }
    Incident:
      type: object
      required: [id, title, description, priority, status, createdAt, updatedAt]
      properties: { id: { type: string }, title: { type: string }, description: { type: string }, priority: { type: string }, status: { type: string }, assignedOperator: { type: string }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, resolvedAt: { type: string, format: date-time }, closedAt: { type: string, format: date-time } }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          required: [alerts, tracks, assets, observations, assessments]
          properties:
            alerts: { type: array, items: { $ref: '#/components/schemas/RelatedAlert' } }
            tracks: { type: array, items: { $ref: '#/components/schemas/RelatedTrack' } }
            assets: { type: array, items: { $ref: '#/components/schemas/RelatedAsset' } }
            observations: { type: array, items: { $ref: '#/components/schemas/RelatedObservation' } }
            assessments: { type: array, items: { $ref: '#/components/schemas/RelatedAssessment' } }
    RelatedAlert:
      type: object
      required: [id, type, severity, state, title, createdAt]
      properties: { id: { type: string }, type: { type: string }, severity: { type: string }, state: { type: string }, title: { type: string }, createdAt: { type: string, format: date-time } }
    RelatedTrack:
      type: object
      required: [id, status, lastSeenAt]
      properties: { id: { type: string }, externalRef: { type: string }, status: { type: string }, position: { $ref: '#/components/schemas/Point' }, lastSeenAt: { type: string, format: date-time } }
    RelatedAsset:
      type: object
      required: [id, name, type, status]
      properties: { id: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, position: { $ref: '#/components/schemas/Point' }, connectionState: { type: string } }
    RelatedObservation:
      type: object
      required: [id, sourceId, type, observedAt]
      properties: { id: { type: string }, sourceId: { type: string }, type: { type: string }, observedAt: { type: string, format: date-time }, position: { $ref: '#/components/schemas/Point' } }
    RelatedAssessment:
      type: object
      required: [id, subjectType, subjectId, type, conclusion, method, createdAt]
      properties: { id: { type: string }, subjectType: { type: string }, subjectId: { type: string }, type: { type: string }, conclusion: { type: string }, method: { type: string }, confidence: { type: number }, createdAt: { type: string, format: date-time } }
    Mission:
      type: object
      required: [id, name, objective, priority, status, createdAt, updatedAt, assets, tasks]
