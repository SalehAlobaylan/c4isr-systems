openapi: 3.1.0
info:
  title: EMAD Platform API
  version: 1.0.0
  license:
    name: Internal use
    identifier: LicenseRef-Internal
  description: |
    Versioned browser contract for Public Context and exercise simulation support.
    Every domain operation uses a server-validated workspace/environment/partition/run.
    Optional X-EMAD-* headers select an existing resource within the credential grants;
    omitting them selects its stored default. Headers never create authority.
    Public evidence has no run; exercise outputs require a run. Controlled assets,
    missions, telemetry, and commands require EXERCISE_OBSERVATION.
    Exercise responses project extensible metadata through a closed allowlist;
    raw payloads, correlation hints, external references, and private resource names
    are not ordinary COP fields. Observation references use stable random opaque
    view_obs_ aliases, resolved under the selected resource for detail, idempotent
    retries, and typed evidence links. Public evidence remains unmodified.
    Scenario definitions and scheduled-event inspection require sim.scenarios.author;
    ordinary run status omits seed, definition name, namespace, and action names.
    Existing configured operator credentials are explicitly bound to default/local
    exercise scopes. Starting a scenario selects its run for subsequent requests;
    concurrent clients should select a run explicitly. Returned IDs are canonical:
    caller-supplied IDs are namespaced outside the legacy compatibility scope.
servers:
  - url: http://{host}:{port}
    description: Local development
    variables:
      host: { default: localhost }
      port: { default: '8080' }
tags:
  - {name: simulation-studio, description: Protected scene authoring and independent native runtime control.}
  - { name: system, description: 'Service health, metrics, and realtime delivery.' }
  - { name: identity, description: 'Operator identity and access.' }
  - { name: sources, description: 'Information source registration and status.' }
  - { name: observations, description: 'Append-only observation evidence.' }
  - { name: assets, description: 'Controlled assets and telemetry.' }
  - { name: tracks, description: 'Derived tracks and analytical hypotheses.' }
  - { name: geospatial, description: 'Geofences and spatial queries.' }
  - { name: alerts, description: 'Operational alerts and acknowledgments.' }
  - { name: incidents, description: 'Incident coordination and relations.' }
  - { name: missions, description: 'Mission planning and task execution.' }
  - { name: commands, description: 'Asset command lifecycle.' }
  - { name: assessments, description: 'Analytical assessments and evidence.' }
  - { name: audit, description: 'Immutable operational history.' }
  - { name: scenarios, description: 'Deterministic scenario replay control.' }
  - { name: picture, description: 'Reconstruction of the operational picture at a point in time.' }
  - { name: imagery, description: 'Scoped imagery, artifacts, independent analysis and evidence review.' }
paths:
  /api/v1/map/surrounding-area:
    post:
      operationId: createSurroundingArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [longitude, latitude, radiusM]
              properties:
                longitude: {type: number, minimum: -180, maximum: 180}
                latitude: {type: number, minimum: -85, maximum: 85}
                radiusM: {type: number, minimum: 100, maximum: 50000}
      responses:
        '200':
          description: PostGIS geodesic analyst context buffer, never a jurisdiction
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/map/measure:
    post:
      operationId: measureMapGeometry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: {type: object, additionalProperties: true, description: Bounded WGS84 Polygon or LineString}
      responses:
        '200':
          description: PostGIS geodesic measurement of analyst geometry
          content:
            application/json:
              schema:
                type: object
                required: [areaM2, perimeterM, lengthM, method, meaning]
                properties:
                  areaM2: {type: number}
                  perimeterM: {type: number}
                  lengthM: {type: number}
                  method: {type: string}
                  meaning: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/geography/regions:
    get:
      operationId: listGeographicRegions
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 160}}
        - {in: query, name: parent, schema: {type: string, maxLength: 160}}
        - {in: query, name: kind, schema: {type: string, enum: [country, region, governorate, place, study]}}
        - {in: query, name: id, schema: {type: string, maxLength: 256}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 5000}}
      responses:
        '200': {description: Authorized versioned geographic reference, content: {application/json: {schema: {$ref: '#/components/schemas/MapFeatureCollection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/geography/editions:
    post:
      operationId: admitGeographicEdition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, label, version, rights, receipt, sha256, artifact]
              properties:
                sourceId: {type: string}
                label: {type: string, maxLength: 200}
                version: {type: string, maxLength: 160}
                rights: {type: object, additionalProperties: true}
                receipt: {type: object, additionalProperties: true}
                sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                artifact: {type: string, format: byte, description: 'Retained WGS84 FeatureCollection bytes, base64 encoded'}
      responses:
        '201': {description: Immutable admitted edition, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '200': {description: Existing identical edition, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/map/features:
    get:
      operationId: getMapFeatures
      parameters:
        - {in: query, name: geometry, schema: {type: string, maxLength: 8192}, description: Analyst WGS84 study polygon; not a jurisdiction}
        - {in: query, name: family, required: true, schema: {type: string, enum: [events, earthquakes, thermal, weather, bulletins, aircraft, vessels, imagery, coverage, findings]}}
        - {in: query, name: region_id, schema: {type: string, maxLength: 256}}
        - {in: query, name: bbox, schema: {type: string}}
        - {in: query, name: source_id, schema: {type: string}}
        - {in: query, name: quality, schema: {type: string}}
        - {in: query, name: view, schema: {type: string, enum: [latest, known_at, effective_at]}}
        - {in: query, name: as_of, schema: {type: string, format: date-time}}
        - {in: query, name: observed_from, schema: {type: string, format: date-time}}
        - {in: query, name: observed_to, schema: {type: string, format: date-time}}
        - {in: query, name: zoom, schema: {type: integer, minimum: 0, maximum: 24}}
      responses:
        '200': {description: Scoped retained features and complete matching count; display limits and unsupported history are explicit, content: {application/json: {schema: {$ref: '#/components/schemas/MapFeatureCollection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/map/reference/{z}/{x}/{y}.pbf:
    get:
      operationId: getReferenceTile
      parameters:
        - {in: path, name: z, required: true, schema: {type: integer, minimum: 0, maximum: 20}}
        - {in: path, name: x, required: true, schema: {type: integer, minimum: 0}}
        - {in: path, name: y, required: true, schema: {type: integer, minimum: 0}}
        - {in: query, name: datasets, required: true, schema: {type: string}}
      responses:
        '200': {description: Authorized PostGIS reference tile, content: {application/vnd.mapbox-vector-tile: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/simulation-recordings/{id}:
    get:
      tags:
      - simulation-studio
      operationId: getSimulationRecording
      summary: getSimulationRecording
      description: Explicit run authorization; immutable artifacts and current grants
