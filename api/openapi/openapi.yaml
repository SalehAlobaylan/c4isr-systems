      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '201': { $ref: '#/components/responses/ScenarioRun' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/picture:
    parameters: [{$ref: '#/components/parameters/WorkspaceHeader'}, {$ref: '#/components/parameters/EnvironmentHeader'}, {$ref: '#/components/parameters/PartitionHeader'}, {$ref: '#/components/parameters/RunHeader'}]
    get:
      tags: [picture]
      security: [{ BearerAuth: [] }]
      description: >-
        Reconstruct the operational picture at a point in time. Omit `at` (or
        pass `live=true`) for the present moment. An instant outside the
        recorded evidence window is clamped to the nearest real one and the
        resolved instant is reported in `at`, so the caller can always tell
        which moment it received.
      operationId: getPicture
      summary: Reconstructed picture at an instant
      parameters:
        - { name: at, in: query, required: false, description: RFC3339 instant to reconstruct., schema: { type: string, format: date-time } }
        - { name: live, in: query, required: false, description: Return the present moment explicitly., schema: { type: boolean } }
        - { name: scope, in: query, required: false, description: Restrict to a scenario resource namespace prefix., schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000 } }
      responses: { '200': { description: Reconstructed picture, content: { application/json: { schema: { $ref: '#/components/schemas/Picture' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/picture/window:
    parameters: [{$ref: '#/components/parameters/WorkspaceHeader'}, {$ref: '#/components/parameters/EnvironmentHeader'}, {$ref: '#/components/parameters/PartitionHeader'}, {$ref: '#/components/parameters/RunHeader'}]
    get:
      tags: [picture]
      security: [{ BearerAuth: [] }]
      description: The span of recorded evidence a scrubber can traverse.
      operationId: getPictureWindow
      summary: Replay window
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: Evidence window, content: { application/json: { schema: { $ref: '#/components/schemas/PictureWindow' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/realtime:
    parameters: [{$ref: '#/components/parameters/WorkspaceHeader'}, {$ref: '#/components/parameters/EnvironmentHeader'}, {$ref: '#/components/parameters/PartitionHeader'}, {$ref: '#/components/parameters/RunHeader'}]
    get:
      tags: [system]
      security: [{ BearerAuth: [] }]
      description: |
        Version 2 COP stream. Every envelope includes its validated resource. Only
        PUBLIC_EVIDENCE and EXERCISE_OBSERVATION are accepted. Topic permissions
        and source constraints are checked before enqueue and immediately before
        send; idle credentials are checked every second. Unknown/internal topics
        are denied. Browser clients offer emad.realtime.v2 and emad.auth.<URI-encoded-token>
        subprotocols; only emad.realtime.v2 is selected. Legacy access_token query
        credentials are consumed and removed before server tracing/logging.
        Optional query selection (workspaceId, environmentId, partition, runId)
        selects existing grants, as do headers. Omitting selection follows the
        credential default. Explicit subscriptions stay pinned.
        realtime.ready and realtime.resync require authorized API snapshots;
        frames are best-effort notifications without a replay cursor. Clients
        must reconcile snapshots after connection, permission/resource changes,
        and gaps. Buffer limit is 256 frames, each at most 64 KiB, with a 5-second
        write timeout. Policy denial closes with 1008; overflow uses 1013.
        A frame already handed to the network cannot be recalled.
      parameters:
        - { name: topics, in: query, description: 'Comma-separated permitted topics. Omission selects the current permitted catalogue.', schema: { type: string, maxLength: 2048 } }
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: environmentId, in: query, schema: { type: string } }
        - { name: partition, in: query, schema: { $ref: '#/components/schemas/DataPartition' } }
        - { name: runId, in: query, schema: { type: string } }
      operationId: realtime
      summary: Realtime
      responses:
        '101': { description: 'WebSocket upgrade; subsequent JSON text frames use this envelope.', content: { application/json: { schema: { $ref: '#/components/schemas/RealtimeEnvelope' } } } }
        '200': { description: WebSocket negotiation response }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
