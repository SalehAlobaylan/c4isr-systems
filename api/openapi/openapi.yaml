        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    WorkspaceHeader:
      name: X-EMAD-Workspace-ID
      in: header
      description: Select an existing authorized workspace; defaults to the credential resource.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,160}$' }
    EnvironmentHeader:
      name: X-EMAD-Environment-ID
      in: header
      description: Select an existing authorized environment within the workspace.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,160}$' }
    PartitionHeader:
      name: X-EMAD-Partition
      in: header
      description: Select a granted partition. Truth requires sim.truth.read in addition to domain permissions.
      schema: { $ref: '#/components/schemas/DataPartition' }
    RunHeader:
      name: X-EMAD-Run-ID
      in: header
      description: Select a granted run. Scenario run routes select their path run; headers cannot widen grants.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,160}$' }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    ScenarioName: { name: name, in: path, required: true, schema: { type: string, pattern: '^(?!runs$)[A-Za-z0-9][A-Za-z0-9_-]*$' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    TrackId: { name: track_id, in: query, schema: { type: string } }
    Lat: { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
    Lng: { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
    RadiusM: { name: radius_m, in: query, required: true, schema: { type: number, exclusiveMinimum: 0 } }
  requestBodies:
    Source:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type]
            properties: { id: { type: string }, name: { type: string }, type: { type: string, enum: [synthetic, operator, external, sensor] }, metadata: { type: object, additionalProperties: true } }
    ObservationInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sourceId, type, observedAt]
            properties:
              semanticKind: {type: string, enum: [moving, point_event, area]}
              geometryRole: {type: string, enum: [reported_location, reported_extent, measurement_footprint, derived_buffer, phenomenon_boundary]}
              id: { type: string }
              sourceId: { type: string }
              type: { type: string }
              observedAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              position: { $ref: '#/components/schemas/Point' }
              area:
                type: object
                description: >-
                  Reports an event with extent rather than a moving object. An
                  area observation is never correlated into a track; it is
                  evaluated against geofences directly. `area` and `position`
                  are mutually exclusive, and `area` may not carry a trackHint.
                required: [kind, polygon]
                properties:
                  kind: { $ref: '#/components/schemas/AreaKind' }
                  polygon: { type: array, minItems: 3, items: { $ref: '#/components/schemas/Point' } }
              payload: { type: object, additionalProperties: true }
              quality: { type: object, additionalProperties: true }
              trackHint: { type: string }
    TelemetryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assetId, observedAt]
            properties:
              messageId: { type: string }
              assetId: { type: string }
              sourceId: { type: string }
              observedAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              position: { $ref: '#/components/schemas/Point' }
              speed: { type: number }
              heading: { type: number }
              health: { type: string }
              connectionState: { type: string }
              payload: { type: object, additionalProperties: true }
    Asset:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type]
            properties: { id: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, capabilities: { type: array, items: { type: string } }, metadata: { type: object, additionalProperties: true } }
    Geofence:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type, polygon]
            properties: { id: { type: string }, name: { type: string }, type: { type: string }, severity: { type: string }, polygon: { type: array, minItems: 3, items: { $ref: '#/components/schemas/Point' } } }
    Incident:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties: { title: { type: string }, description: { type: string }, priority: { type: string }, alertIds: { type: array, items: { type: string } }, trackIds: { type: array, items: { type: string } }, assetIds: { type: array, items: { type: string } }, observationIds: { type: array, items: { type: string } }, assessmentIds: { type: array, items: { type: string } } }
    Mission:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties: { name: { type: string }, objective: { type: string }, priority: { type: string }, incidentId: { type: string }, assets: { type: array, items: { type: string } }, tasks: { type: array, items: { type: object, properties: { type: { type: string }, description: { type: string }, target: { $ref: '#/components/schemas/Point' } } } } }
    Command:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assetId, type]
            properties: { requestKey: { type: string, maxLength: 160, description: Required for native exercise tasking; retries retain the same key. }, assetId: { type: string }, missionId: { type: string }, incidentId: { type: string }, type: { type: string }, payload: { type: object, additionalProperties: true } }
    Assessment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subjectType, subjectId, type, conclusion]
            properties: { subjectType: { type: string }, subjectId: { type: string }, type: { type: string }, conclusion: { type: string }, confidence: { type: number, minimum: 0, maximum: 1 }, method: { type: string }, createdBy: { type: string }, evidence: { type: array, items: { type: object, required: [type, id], properties: { type: { type: string }, id: { type: string } } } } }
  schemas:
    MapFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string}
              geometry: {type: object, additionalProperties: true}
              properties: {type: object, additionalProperties: true}
        total: {type: integer}
        matched: {type: integer}
        truncated: {type: boolean}
        state: {type: string}
        scope: {type: string}
        countMeaning: {type: string}
        unlocated: {type: integer, minimum: 0}
    SceneVector:
      type: object
      required:
      - x
      - y
      - z
      properties:
        x: &emad_existing_2
          type: number
        y: *emad_existing_2
        z: *emad_existing_2
    ScenePlacement:
      type: object
      required:
      - id
      - templateId
      - position
      - heading
      - speedMps
      - waypoints
      - spawnMs
      - despawnMs
      properties:
        id: &emad_existing_3
          type: string
        templateId: *emad_existing_3
        position:
          $ref: '#/components/schemas/SimulationPosition'
        heading: *emad_existing_2
        speedMps: *emad_existing_2
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/SimulationPosition'
        spawnMs: &emad_existing_4
          type: integer
        despawnMs: *emad_existing_4
    RecordingBlob:
      type: object
      required:
      - sha256
      - bytes
      - first
      - last
      properties:
        sha256:
          type: string
        bytes:
          type: integer
        first:
          type: integer
        last:
          type: integer
    RecordingManifest:
      type: object
      required:
      - schema
      - runId
      - partition
      - epoch
      - elapsedMs
      - runStatus
      - projectionSettled
      - events
      - chunks
      - checkpoint
      - contentSha256
      - createdAt
      - retainUntil
      - replayGuarantee
      properties:
        schema:
          type: string
        runId:
          type: string
        partition:
          type: string
        epoch:
          type: string
          format: date-time
        elapsedMs:
          type: integer
        runStatus:
          type: string
        projectionSettled:
          type: boolean
        events:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/RecordingBlob'
        checkpoint:
          $ref: '#/components/schemas/RecordingBlob'
        contentSha256:
          type: string
        createdAt:
          type: string
          format: date-time
        retainUntil:
          type: string
          format: date-time
        replayGuarantee:
          type: string
    RecordingIndex:
      type: object
      required:
      - status
      - errorCode
      - attempts
      - maxAttempts
      properties:
        status:
          type: string
          enum:
          - QUEUED
          - PROCESSING
          - READY
          - FAILED
        errorCode:
