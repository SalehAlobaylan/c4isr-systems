      responses:
        '200':
          description: Authenticated operator and effective permissions
          content:
            application/json:
              schema:
                type: object
                required: [operator, permissions, principal, resource]
                properties:
                  resources:
                    description: Existing ordinary COP resources authorized by live grants; excludes input and truth.
                    type: array
                    items: { $ref: '#/components/schemas/AccessResource' }
                  resourceDetails:
                    description: Navigation labels for the same selectable resources. Exercise state and start time require scenarios.read in that resource; no authoring scene or truth is read.
                    type: array
                    items:
                      type: object
                      required: [resource, label, kind]
                      properties:
                        resource: { $ref: '#/components/schemas/AccessResource' }
                        label: { type: string }
                        kind: { type: string, enum: [public, exercise, legacy] }
                        status: { type: string }
                        startedAt: { type: string, format: date-time }
                  accessRevision:
                    description: Opaque access fingerprint; changes when grants or source restrictions change.
