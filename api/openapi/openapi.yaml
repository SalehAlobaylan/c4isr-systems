      - hazard
      - weather
      - environmental
      - infrastructure
      - crowd
    ObservationArea:
      type: object
      description: A footprint describing an event with extent - a wildfire, an earthquake, a weather cell - rather than a moving object. Area observations
        are never correlated into a track; they raise alerts directly.
