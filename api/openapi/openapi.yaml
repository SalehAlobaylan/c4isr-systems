          application/json:
            schema: { type: object, required: [state], properties: { state: { type: string }, reason: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Command' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/assessments:
    get:
      tags: [assessments]
      operationId: listAssessments
