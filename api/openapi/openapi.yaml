          type: string
        qualityArtifactId:
          type: string
        receiptArtifactId:
          type: string
        windowArtifactIds:
          type: array
          items:
            type: string
    ImageryCapture:
      type: object
      required:
      - id
      - sourceId
      - input
      - status
      - attempt
      - progress
      - errorCode
      - createdAt
      properties:
        id:
          type: string
        sourceId:
          type: string
        input:
          type: object
          required:
