    FeatureReadiness:
      type: object
      required:
      - checkedAt
      - resource
      - features
      - workers
      properties:
        checkedAt:
          type: string
        resource:
          type: object
          additionalProperties: true
        features:
          type: array
          items:
            type: object
            required:
            - id
            - state
            - count
            - nextAction
            properties:
              id:
                type: string
              state:
                type: string
              count:
                type: integer
              nextAction:
                type: string
        workers:
          type: array
          items:
            type: object
            required:
            - feature
            - lastSeenAt
            - state
            properties:
              feature:
                type: string
              lastSeenAt:
                type: string
              state:
                type: string
              runtimeBuild:
                type: string
    WorkerHeartbeat:
      type: object
      required:
      - feature
      properties:
        feature:
          type: string
          enum:
          - connectors
          - imagery
          - assets
          - runtime
          - recordings
          - preparation
        runtimeBuild:
          type: string
    RuntimeCapability:
      type: object
      required:
      - runtimeBuild
      - runtimeVersion
      - state
      properties:
        runtimeBuild:
          type: string
        runtimeVersion:
          type: string
        state:
          type: string
    ReferenceViewport:
      type: object
      required:
      - type
      - features
      - matched
      - truncated
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          items:
            type: object
            additionalProperties: true
        matched:
          type: integer
        truncated:
          type: boolean
