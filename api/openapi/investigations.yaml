openapi: 3.1.0
info:
  title: Investigation contracts
  version: 1.0.0
paths:
  /investigations:
    get:
      operationId: listInvestigations
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 10000
      responses:
        '200':
          description: Authorized current cases, including archived cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationList'
    post:
      operationId: createInvestigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationInput'
      responses:
        '201':
          description: Saved case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
  /investigations/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getInvestigation
      parameters:
      - in: query
        name: revision
        schema:
          type: string
      responses:
        '200':
          description: Exact authorized case revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
  /investigations/{id}/revisions:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: saveInvestigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationInput'
      responses:
        '201':
          description: New immutable revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '409':
          description: Head changed; submitted draft was not applied
  /investigations/{id}/members:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      operationId: changeInvestigationMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationMembership'
      responses:
        '200':
          description: Audited membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
components:
  schemas:
    InvestigationEvidence:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - observation
          - artifact
          - reference
          - assessment
          - job
          - capture
          - analysis
        id:
          type: string
        sha256:
          type: string
        sourceId:
          type: string
    InvestigationInput:
      type: object
      additionalProperties: false
      required:
      - title
      - question
      - notes
      - state
      - scope
      - evidence
      properties:
        expectedRevisionId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        question:
          type: string
          minLength: 1
          maxLength: 4000
        notes:
          type: string
          maxLength: 64000
        state:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        scope:
          $ref: ./analyst-scope.yaml#/components/schemas/ScopeInput
        evidence:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/InvestigationEvidence'
        requestKey:
          type: string
        findings:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/FindingInput
    InvestigationRevision:
      type: object
      required:
      - id
      - caseId
      - version
      - title
      - question
      - notes
      - state
      - scope
      - evidence
      - actorHumanId
      - recordedAt
      properties:
        id:
          type: string
        caseId:
          type: string
        version:
          type: integer
        previousId:
          type: string
        title:
          type: string
        question:
          type: string
        notes:
          type: string
        state:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        scope:
          $ref: ./analyst-scope.yaml#/components/schemas/ScopeSnapshot
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationEvidence'
        actorHumanId:
          type: string
        recordedAt:
          type: string
          format: date-time
        findings:
          type:
          - array
          - 'null'
          items:
            $ref: ./openapi.yaml#/components/schemas/FindingRevision
    Investigation:
      type: object
      required:
      - id
      - ownerHumanId
      - members
      - membershipVersion
      - revision
      properties:
        id:
          type: string
        membershipVersion:
          type: integer
        ownerHumanId:
          type: string
        members:
          type: array
          items:
            type: string
        revision:
          $ref: '#/components/schemas/InvestigationRevision'
        evidenceValidity:
          type: array
          items:
            $ref: ./acquisition-coverage.yaml#/components/schemas/EvidenceValidity
        notices:
          type: array
          items:
            $ref: ./openapi.yaml#/components/schemas/CaseNotice
        workflow:
          $ref: ./openapi.yaml#/components/schemas/CaseReviewEvent
    InvestigationMembership:
      type: object
      additionalProperties: false
      required:
      - expectedRevisionId
      - expectedMembershipVersion
      - ownerHumanId
      - members
      properties:
        expectedRevisionId:
          type: string
        expectedMembershipVersion:
          type: integer
          minimum: 1
        ownerHumanId:
          type: string
        members:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
    InvestigationList:
      type: object
      required:
      - items
      - total
      - offset
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Investigation'
        total:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
