      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EnvironmentAssessment'}}
        next: {type: string}
    EnvironmentSuitabilityRequest:
      type: object
      additionalProperties: true
      required: [schema, requirementId, operation, release, representations]
      properties:
        schema: {type: string, const: emad.environment-requirement.v1}
        requirementId: {type: string}
        operation: {type: string}
        release:
          type: object
          required: [manifestSha256, areaRevisionId]
          properties:
            manifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            areaRevisionId: {type: string}
        resources:
          type: object
          properties:
            maxMembers: {type: integer}
            maxBytes: {type: integer}
        terms:
          type: object
          properties:
            requireIssued: {type: boolean}
            operation: {type: string}
        area:
          type: object
          properties:
            geometry: {type: object, additionalProperties: true}
            allowPartial: {type: boolean}
        time:
          type: object
          additionalProperties: true
        representations:
          type: array
          items:
            type: object
            required: [layer]
            properties:
              id: {type: string}
              layer: {type: string}
              required: {type: boolean}
              units: {type: string}
              verticalDatum: {type: string}
              minValidFraction: {type: number}
              allowVisualDerivative: {type: boolean}
              accuracy:
                type: object
                properties:
                  mode: {type: string, enum: [unknown-acceptable, independent-assessment]}
                  use: {type: string}
                  toleranceM: {type: number}
    EnvironmentSuitabilityDecision:
      type: object
      additionalProperties: true
      required: [requirement, kind, result, reason, detail, evidenceSha256]
      properties:
        requirement: {type: string}
        kind: {type: string}
        result: {type: string, enum: [pass, unsupported, unqualified, optional-omitted]}
        reason: {type: string, description: Versioned reason code documented with the decision engine.}
        detail: {type: string}
        evidenceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    EnvironmentSuitabilityResult:
      type: object
      required: [schema, requirementId, operation, overall, release, evidenceSha256, coverage, decisions, optional]
      properties:
        schema: {type: string, const: emad.environment-suitability.v1}
        requirementId: {type: string}
        operation: {type: string}
        overall: {type: string, enum: [supported, unsupported, unqualified]}
        release:
          type: object
          required: [manifestSha256, areaRevisionId, profileId]
          properties:
            manifestSha256: {type: string}
            areaRevisionId: {type: string}
            profileId: {type: string}
        evidenceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        terms: {type: [object, 'null'], additionalProperties: true}
        coverage: {type: [number, 'null'], minimum: 0, maximum: 1}
        decisions:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentSuitabilityDecision'}
        optional:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentSuitabilityDecision'}
