paths:
  /api/v1/environment-sources/{id}/admissions:
    post:
      operationId: admitRetainedGeographicSource
      summary: Record reviewed offline geographic source rights
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetainedGeographicAdmission'}
      responses:
        '201':
          description: Exact retained-source admission and profile revision
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '4XX':
          description: Request rejected
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/Error'}
  /api/v1/catalog/reads/{id}:
    delete:
      operationId: releaseCatalogRead
      summary: Release catalog read
      parameters:
        - {"name":"id","in":"path","required":true,"schema":{"type":"string"}}
      responses:
        '204':
          description: Catalog snapshot released
        '4XX':
          description: Request rejected
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/Error'}
  /api/v1/environment-profiles:
    get:
      operationId: listEnvironmentProfiles
      summary: List environment profiles
      responses:
        '200':
          description: Scoped environment library result
          content:
            application/json:
