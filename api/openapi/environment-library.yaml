    EnvironmentAssessmentInput:
      type: object
      required: [manifestSha256, memberSha256, layer, use, method, controlSetSha256, statisticM, uncertaintyM, area, decision, note]
      properties:
        manifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        memberSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Exact retained member digest this evidence qualifies.}
        layer: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$'}
        use: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$', description: Declared use the assessment supports.}
        method: {type: string, minLength: 1, maxLength: 1000}
        controlSetSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the held-out control set, stored separately from the release.}
        statisticM: {type: number, minimum: 0, maximum: 100000}
        uncertaintyM: {type: number, minimum: 0, maximum: 100000}
        area: {type: object, additionalProperties: true, description: Valid WGS84 polygon or multipolygon inside the release area that the assessment covers.}
        decision: {type: string, enum: [ACCEPTED, REJECTED]}
        note: {type: string, minLength: 1, maxLength: 2000}
    EnvironmentAssessmentCorrection:
      type: object
      required: [method, controlSetSha256, statisticM, uncertaintyM, area, decision, note]
      properties:
        method: {type: string, minLength: 1, maxLength: 1000}
        controlSetSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        statisticM: {type: number, minimum: 0, maximum: 100000}
        uncertaintyM: {type: number, minimum: 0, maximum: 100000}
        area: {type: object, additionalProperties: true}
        decision: {type: string, enum: [ACCEPTED, REJECTED]}
        note: {type: string, minLength: 1, maxLength: 2000}
    EnvironmentAssessment:
      type: object
      required: [id, releaseId, manifestSha256, releaseManifestSha256, memberSha256, layer, use, method, controlSetSha256, statisticM, uncertaintyM, area, decision, sequence, reviewerHumanId, reviewedAt, evidenceSha256]
      properties:
        id: {type: string}
        releaseId: {type: string}
        manifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        releaseManifestSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        memberSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        layer: {type: string}
        use: {type: string}
        method: {type: string}
        controlSetSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        statisticM: {type: number}
        uncertaintyM: {type: number}
        area: {type: object, additionalProperties: true}
        decision: {type: string, enum: [ACCEPTED, REJECTED]}
        sequence: {type: integer}
        supersedesId: {type: string}
        supersededBy: {type: string}
        reviewerHumanId: {type: string}
        reviewedAt: {type: string, format: date-time}
        evidenceSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the immutable record, pinned by any decision that used it.}
        note: {type: string}
