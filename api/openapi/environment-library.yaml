components:
  schemas:
    RetainedGeographicAdmission:
      type: object
      required: [originalProducer, upstreamProvider, dataset, productVersion, coverageDescription, area, rights, enabled]
      properties:
        originalProducer: {type: string}
        upstreamProvider: {type: string}
        dataset: {type: string}
        productVersion: {type: string}
        coverageDescription: {type: string}
        area:
          type: object
          required: [west, south, east, north]
          properties:
            west: {type: number}
            south: {type: number}
            east: {type: number}
            north: {type: number}
        rights: {type: object, additionalProperties: true}
        enabled: {type: boolean}
        expectedRevisionId: {type: string}
    EnvironmentProfile:
      type: object
      required: [id, name, requiredLayers]
      properties:
        id: {"type":"string"}
        name: {"type":"string"}
        requiredLayers: {"type":"array","items":{"type":"string"}}
        optionalLayers: {"type":"array","items":{"type":"string"}}
    EnvironmentDefinitionInput:
      type: object
      required: [name, areaRevisionId, profileId, assetIds, expectedRevision]
      properties:
        name: {"type":"string"}
        areaRevisionId: {"type":"string"}
        profileId: {"type":"string"}
        assetIds: {"type":"array","items":{"type":"string"}}
        expectedRevision: {"type":"integer"}
    EnvironmentDefinition:
      type: object
      required: [id, revision, name, areaRevisionId, profileId, assetIds, expectedRevision]
      properties:
        id: {"type":"string"}
        revision: {"type":"integer"}
        name: {"type":"string"}
        areaRevisionId: {"type":"string"}
        profileId: {"type":"string"}
        assetIds: {"type":"array","items":{"type":"string"}}
        expectedRevision: {"type":"integer"}
    EnvironmentDefinitions:
      type: object
      required: [items]
      properties:
        items: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentDefinition"}}
        next: {"type":"string"}
    EnvironmentRepresentation:
      type: object
      required: [layer, format, producer, productEdition, dataTime, retrievedAt, crs, verticalDatum, nativeResolution, semantics, uncertainty, evidence, footprint]
      properties:
        layer: {"type":"string"}
        format: {"type":"string"}
        producer: {"type":"string"}
        productEdition: {"type":"string"}
        dataTime: {"type":"string"}
        retrievedAt: {"type":"string"}
        crs: {"type":"string"}
        verticalDatum: {"type":"string"}
        nativeResolution: {"type":"string"}
        semantics: {"type":"string"}
        uncertainty: {"type":"string"}
        evidence: {"type":"string"}
        footprint: {"type":"object","additionalProperties":true}
    EnvironmentAssetInput:
      type: object
      required: [requestKey, sourceId, admissionId, sha256, bytes, retainUntil, representation]
      properties:
        requestKey: {"type":"string"}
        sourceId: {"type":"string"}
        admissionId: {"type":"string"}
        referenceId: {"type":"string"}
        sceneId: {"type":"string"}
        sha256: {"type":"string"}
        bytes: {"type":"integer"}
        retainUntil: {"type":"string"}
        representation: {"$ref":"#/components/schemas/EnvironmentRepresentation"}
    EnvironmentAsset:
      type: object
      required: [id, state, mediaType, sourceId, admissionId, sha256, bytes, retainUntil, representation, rights]
      properties:
        id: {"type":"string"}
        state: {"type":"string"}
        mediaType: {"type":"string"}
        sourceId: {"type":"string"}
        admissionId: {"type":"string"}
        sha256: {"type":"string"}
        bytes: {"type":"integer"}
        retainUntil: {"type":"string"}
        representation: {"$ref":"#/components/schemas/EnvironmentRepresentation"}
        rights: {"type":"object","additionalProperties":true}
    EnvironmentAssets:
      type: object
      required: [items]
      properties:
        items: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentAsset"}}
        next: {"type":"string"}
    EnvironmentPreflight:
      type: object
      required: [eligible, diagnostics, inputs, inputBytes, rebuildAllowed]
      properties:
        eligible: {"type":"boolean"}
        diagnostics: {"type":"array","items":{"type":"string"}}
        inputs: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentAsset"}}
        inputBytes: {"type":"integer"}
        rebuildAllowed: {"type":"boolean"}
    EnvironmentBuildInput:
      type: object
      required: [requestKey, revision]
      properties:
        requestKey: {"type":"string"}
        revision: {"type":"integer"}
    EnvironmentBuild:
      type: object
      required: [id, definitionId, definitionRevision, state, attempt, createdAt, inputSha256]
      properties:
        id: {"type":"string"}
        definitionId: {"type":"string"}
        definitionRevision: {"type":"integer"}
        state: {"type":"string"}
        attempt: {"type":"integer"}
        failureCode: {"type":"string"}
        createdAt: {"type":"string"}
        inputSha256: {"type":"string"}
    EnvironmentAttempt:
      type: object
      required: [attempt, state, code, at]
      properties:
        attempt: {"type":"integer"}
        state: {"type":"string"}
        code: {"type":"string"}
        at: {"type":"string"}
    EnvironmentReview:
      type: object
      required: [manifestSha256, note]
      properties:
        manifestSha256: {"type":"string"}
        note: {"type":"string"}
    EnvironmentQuality:
      type: object
      required: [coordinateErrorM, physicalAccuracy, meaning, heightMethod, unsupported]
      properties:
        coordinateErrorM: {"type":"number"}
        physicalAccuracy: {"type":"string"}
        meaning: {"type":"string"}
        heightMethod: {"type":"string"}
        unsupported: {"type":"array","items":{"type":"string"}}
    EnvironmentMember:
      type: object
      required: [name, layer, sha256, bytes, inputId, details]
      properties:
        name: {"type":"string"}
        layer: {"type":"string"}
        sha256: {"type":"string"}
        bytes: {"type":"integer"}
        inputId: {"type":"string"}
        details: {"type":"object","additionalProperties":true}
    EnvironmentManifest:
      type: object
      required: [schema, inputSha256, toolchainSha256, profileId, areaRevisionId, area, frame, inputs, members, quality]
      properties:
        schema: {"type":"string"}
        inputSha256: {"type":"string"}
        toolchainSha256: {"type":"string"}
        profileId: {"type":"string"}
        areaRevisionId: {"type":"string"}
        area: {"type":"object","additionalProperties":true}
        frame: {"type":"object","additionalProperties":true}
        inputs: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentAsset"}}
        members: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentMember"}}
        quality: {"$ref":"#/components/schemas/EnvironmentQuality"}
    EnvironmentRelease:
      type: object
      required: [id, buildId, name, state, manifestSha256, bundleId, createdAt]
      properties:
        id: {"type":"string"}
        buildId: {"type":"string"}
        name: {"type":"string"}
        state: {"type":"string"}
        manifestSha256: {"type":"string"}
        manifest: {"$ref":"#/components/schemas/EnvironmentManifest"}
        bundleId: {"type":"string"}
        createdAt: {"type":"string"}
    EnvironmentReleases:
      type: object
      required: [items]
      properties:
        items: {"type":"array","items":{"$ref":"#/components/schemas/EnvironmentRelease"}}
        next: {"type":"string"}
